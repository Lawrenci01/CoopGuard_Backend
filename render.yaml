services:
  - type: web
    name: coopguard-api
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run typecheck
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: CG_HTTPS
        value: "false"
      - key: CG_TRUST_PROXY
        value: "true"
      - key: CG_DB_PATH
        value: /var/data/coopguard.sqlite
    disk:
      name: coopguard-data
      mountPath: /var/data
      sizeGB: 1
